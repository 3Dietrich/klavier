<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klavier">
<meta name="theme-color" content="#111111">
<title>Klavier</title>
<!-- Klavier fürs iPhone (@dd 20261102): eigene Klangerzeugung (Web Audio), weil Safari auf dem
     iPhone kein Web-MIDI kann. Quer zwei Reihen, hochkant drei bis fünf, Tasten einstellbar
     je Lage (⚙). MIDI-Ausgang nur dort, wo der Browser ihn anbietet (Chrome am Mac). -->
<style>
:root {
    --grund: #111; --leiste: #1c1c1c; --knopf: #2c2c2c; --text: #eee; --gold: #e0a526;
    --weiss: #f4f1ea; --weiss-an: #f2c25a; --schwarz-an: #b07818;
}
html, body { margin: 0; height: 100%; background: var(--grund); color: var(--text);
    font-family: -apple-system, system-ui, sans-serif; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; }
body { display: flex; flex-direction: column; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
/* Rand nur, wo er gebraucht wird: quer nur auf der Seite der Kamera-Aussparung. Am Home-Strich bleibt
   immer ein Streifen frei, sonst greift beim Wischen vom Rand die Home-Geste des iPhones und die Seite
   bekommt die Finger nicht mehr. Gedreht liegt der Home-Strich an der rechten Seitenkante */
html.kerbe-links body { padding-right: 0; }
html.kerbe-rechts body { padding-left: 0; }
html.gedreht body { padding: 0 env(safe-area-inset-bottom) 0 0; }

/* Leiste oben */
/* Keine Textauswahl und keine Lupe beim langen Drücken (iPhone) */
* { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
/* Schmale Leiste: Knöpfe füllen ihre ganze Höhe, damit die Trefferfläche trotzdem groß bleibt */
#leiste { display: flex; align-items: stretch; gap: 4px; padding: 0 4px; height: 38px; background: var(--leiste);
    flex: none; touch-action: none; }
#leiste button { height: auto; min-width: 54px; font-size: 20px; border-radius: 0 0 8px 8px; }
button { font: inherit; color: var(--text); background: var(--knopf); border: 0; border-radius: 10px;
    min-width: 48px; height: 46px; font-size: 22px; padding: 0 10px; touch-action: manipulation; cursor: pointer; }
button:active { background: #444; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#lage { flex: 1; align-self: center; text-align: center; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hilfeKnopf { padding: 0; font-weight: 600; }
body.hilfemodus #hilfeKnopf { background: var(--gold); color: #111; }

/* Tastatur: unterste Reihe = tiefste Töne */
#tasten { flex: 1; display: flex; flex-direction: column-reverse; gap: 6px; padding: 3px; min-height: 0; touch-action: none; }
.reihe { flex: 1; position: relative; min-height: 0; }
.w { position: absolute; top: 0; bottom: 0; background: var(--weiss); border: 1px solid #8a8780;
    border-radius: 0 0 8px 8px; box-sizing: border-box; display: flex; align-items: flex-end;
    justify-content: center; color: #6a6660; padding-bottom: 6px; }
.w.mitte { box-shadow: inset 0 -5px 0 var(--gold); }
.s { position: absolute; top: 0; z-index: 2; box-sizing: border-box; border: 1px solid #000;
    background: linear-gradient(#3a3a3a, #111 85%); border-radius: 0 0 6px 6px;
    /* heller Seitenstrich: berühren sich Nachbarn (100 % Breite), bleibt ein klarer heller Strich dazwischen */
    border-left-color: #b4b4b4; border-right-color: #b4b4b4; }
.w.an { background: var(--weiss-an); }
.s.an { background: var(--schwarz-an); }
.w span { pointer-events: none; text-align: center; line-height: 1.05; }
.w span small { font-size: 70%; }
.w.aus { background: #3c3b39; border-color: #2c2b29; }
.s.aus { background: #1a1a1a; border-color: #111; opacity: .6; }

/* Einstellungen: höchstens zwei Drittel der Fläche. Die Tasten daneben bleiben sichtbar, ändern sich live
   und lassen sich spielen, solange die Einstellungen offen sind. Schließen nur mit Fertig (oder Esc) */
#einst { position: fixed; z-index: 10; background: #1e1e1e; box-shadow: 0 0 30px #000;
    overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 12px 14px 16px; box-sizing: border-box; display: none; }
#einst.offen { display: block; }
html.lage-quer #einst { top: 0; bottom: 0; left: 0; width: 58%; }
html.lage-hoch #einst { top: 0; left: 0; right: 0; height: 58%; }
/* Ausrichtung fest gewählt und Gerät anders gehalten: ganze Seite um 90° im Uhrzeigersinn drehen
   (Breite/Höhe setzt JS). Feste Elemente drehen mit, weil body transformiert ist. */
html.gedreht body { position: fixed; top: 0; left: 0; transform-origin: top left;
    transform: rotate(90deg) translateY(-100%); }
/* Kopf mit Fertig bleibt beim Scrollen oben stehen */
#einst h2 { font-size: 22px; margin: -12px -14px 4px; padding: 6px 14px; display: flex; align-items: center; gap: 10px;
    position: sticky; top: -12px; background: #1e1e1e; z-index: 1; box-shadow: 0 6px 8px -6px #000; }
#fertig { min-width: 120px; height: 46px; background: var(--gold); color: #111; font-weight: 600; }
#einst h2 span { flex: 1; }
#version { font-size: 15px; font-weight: 400; color: #999; font-variant-numeric: tabular-nums; }
.zeile { display: grid; grid-template-columns: minmax(6.5em, 30%) 1fr; align-items: center; gap: 10px;
    padding: 5px 0; border-bottom: 1px solid #2a2a2a; }
.zeile:last-child { border-bottom: 0; }
.zeile.knoepfe { display: flex; padding-top: 10px; }
[hidden] { display: none !important; }
.zeile > label, .zeile > .titel { display: flex; flex-direction: column; font-size: 18px; line-height: 1.15; }
.zeile b { color: var(--gold); font-weight: 600; }
.titel button { height: 40px; min-width: 0; font-size: 17px; margin-top: 4px; align-self: flex-start; }
.titel button[aria-pressed=true] { background: var(--gold); color: #111; }
/* Regler: die ganze Zeile ist Ziehfläche. Waagrecht ziehen stellt ein, senkrecht scrollt
   die Einstellungen (der Regler selbst fängt keine Finger, sonst hängt das Scrollen an ihm fest) */
.zeile.regel { touch-action: pan-y; cursor: ew-resize; }
/* Gedrehte Seite: der Browser scrollt nur in Bildschirmrichtung, die Einstellungen laufen aber quer über
   den Schirm. Dort übernimmt die Seite Scrollen und Regler selbst */
html.gedreht #einst, html.gedreht .zeile.regel { touch-action: none; }
.zeile.regel input { pointer-events: none; }
.zeile.regel.zieht input::-webkit-slider-thumb { box-shadow: 0 0 0 8px #e0a52655; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 8px; background: #555; border-radius: 4px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 36px; height: 36px; border-radius: 50%;
    background: var(--gold); margin-top: -14px; }
input[type=range]::-moz-range-thumb { width: 36px; height: 36px; border-radius: 50%; background: var(--gold); border: 0; }
.wahl { display: flex; flex-wrap: wrap; gap: 6px; }
.wahl button { font-size: 18px; flex: 1 1 auto; height: 44px; padding: 0 8px; }
.wahl button[aria-pressed=true] { background: var(--gold); color: #111; }
/* Stimmen 4 bis 16 immer in einer Reihe */
#stimmenWahl { flex-wrap: nowrap; }
#stimmenWahl button { flex: 1 1 0; min-width: 0; padding: 0 2px; }
select { font: inherit; font-size: 18px; width: 100%; height: 44px; background: var(--knopf); color: var(--text); border: 0; border-radius: 10px; }

/* Hilfemodus */
body.hilfemodus [data-hilfe] { outline: 2px dashed var(--gold); outline-offset: 3px; transition: outline-color .2s; }
#blase { position: fixed; z-index: 20; left: 50%; bottom: 16px; transform: translateX(-50%); max-width: min(560px, 90vw);
    background: #2a2416; border: 2px solid var(--gold); border-radius: 14px; padding: 12px 16px; font-size: 19px;
    line-height: 1.35; display: none; }
#blase.offen { display: block; }
</style>
</head>
<body>
<div id="leiste">
    <button id="okRunter" data-hilfe="Alle Reihen eine Oktave tiefer." aria-label="Oktave tiefer">«</button>
    <button id="tonRunter" data-hilfe="Alle Reihen einen Halbton tiefer, die unterste Reihe kann so auch mit einer schwarzen Taste beginnen." aria-label="Einen Halbton tiefer">‹</button>
    <div id="lage" data-hilfe="Tiefster und höchster Ton. c' ist das mittlere C (gelb unterstrichen).">C</div>
    <button id="tonHoch" data-hilfe="Alle Reihen einen Halbton höher." aria-label="Einen Halbton höher">›</button>
    <button id="okHoch" data-hilfe="Alle Reihen eine Oktave höher." aria-label="Oktave höher">»</button>
    <button id="einstKnopf" data-hilfe="Einstellungen: Tastenbreite, schwarze Tasten, Reihen, Klang. Gelten getrennt für quer und hochkant." aria-label="Einstellungen">⚙</button>
    <button id="hilfeKnopf" aria-label="Hilfe">?</button>
</div>
<div id="tasten" data-hilfe="Tasten antippen, mit mehreren Fingern gleichzeitig. Über die Tasten wischen spielt jede Taste an. Der Bildschirm bleibt an, solange die Seite offen ist."></div>

<div id="einst" role="dialog" aria-label="Einstellungen">
    <h2><span id="einstTitel">Einstellungen</span><small id="version" data-hilfe="Stand der Seite: Tag und Uhrzeit, wann sie hochgeladen wurde. Zum Nachsehen, ob das iPhone schon die neue Fassung hat."></small><button id="fertig" data-hilfe="Schließt die Einstellungen (auch Esc). Solange sie offen sind, lassen sich die Tasten daneben spielen und ausprobieren.">✕ Fertig</button></h2>
    <div class="zeile" data-hilfe="Auto folgt dem iPhone. Hoch oder Breit hält die Tastatur fest, egal wie das iPhone liegt, auch bei gesperrter Bildschirmdrehung. Ist das iPhone anders gehalten, steht die Seite gedreht.">
        <div class="titel">Ausrichtung</div>
        <div class="wahl" id="ausrichtungWahl"></div>
    </div>
    <div class="zeile" data-hilfe="Breite der weißen Tasten. Daraus ergibt sich, wie viele Tasten in eine Reihe passen.">
        <label for="breite">Weiße Tasten <b id="breiteW"></b></label>
        <input type="range" id="breite" min="28" max="120" step="1">
    </div>
    <div class="zeile" data-hilfe="Breite der schwarzen Tasten im Verhältnis zur weißen Taste.">
        <label for="sBreite">Schwarz breit <b id="sBreiteW"></b></label>
        <input type="range" id="sBreite" min="35" max="100" step="1">
    </div>
    <div class="zeile" data-hilfe="Länge der schwarzen Tasten im Verhältnis zur weißen Taste.">
        <label for="sLaenge">Schwarz lang <b id="sLaengeW"></b></label>
        <input type="range" id="sLaenge" min="35" max="100" step="1">
    </div>
    <div class="zeile" data-hilfe="Wie viele Tastenreihen übereinander. Höchstens so viele, dass die weißen Tasten noch mindestens so lang wie breit sind, darum hängt das Ende des Reglers von Bildschirm und Tastenbreite ab. Auto: so viele, dass die Tasten etwas länger als breit sind.">
        <div class="titel"><span>Reihen <b id="reihenW"></b></span><button id="reihenAuto">Auto</button></div>
        <input type="range" id="reihen" min="1" max="4" step="1">
    </div>
    <div class="zeile" data-hilfe="Womit die nächste Reihe beginnt. Anschließend: wo die Reihe darunter aufhört. Oktave, Quinte, Quarte: so viel höher als der Anfang der Reihe darunter.">
        <div class="titel">Nächste Reihe</div>
        <div class="wahl" id="abstandWahl"></div>
    </div>
    <div class="zeile" id="buendigZeile" data-hilfe="Für Oktave, Quinte, Quarte. An: die nächste Reihe geht so viele Oktav-, Quint- oder Quartschritte hinauf, dass sie kurz vor dem Ende der Reihe darunter beginnt. Es wiederholen sich nur wenige Tasten. Aus: genau ein Schritt über dem Anfang der Reihe darunter.">
        <div class="titel">Anschließen</div>
        <div class="wahl" id="buendigWahl"></div>
    </div>
    <div class="zeile" data-hilfe="Klavier klingt aus wie ein Flügel. Weich hält den Ton, solange der Finger liegt, gut für Anfangstöne.">
        <div class="titel">Klang</div>
        <div class="wahl" id="klangWahl"></div>
    </div>
    <div class="zeile" data-hilfe="Wie viele Töne höchstens gleichzeitig klingen. Kommt einer dazu, verstummt zuerst der älteste schon losgelassene Ton, sonst der älteste gehaltene. Weniger Stimmen heißt weniger Rechenarbeit fürs iPhone.">
        <div class="titel">Stimmen</div>
        <div class="wahl" id="stimmenWahl"></div>
    </div>
    <div class="zeile" data-hilfe="Verdichter: greift erst, wenn mehrere Töne zusammen lauter werden als ein einzelner, und nimmt Akkorde etwas zurück. Ein einzelner Ton bleibt unberührt, auch der erste nach einer Pause.">
        <div class="titel">Verdichter</div>
        <div class="wahl" id="verdichterWahl"></div>
    </div>
    <div class="zeile" data-hilfe="Schärfe des gewählten Klangs: links rund und weich, rechts laut, hell und durchsetzungsfähig. Jeder Klang merkt sich seine eigene Einstellung.">
        <label for="schaerfe">Schärfe <b id="schaerfeW"></b></label>
        <input type="range" id="schaerfe" min="0" max="100" step="1">
    </div>
    <div class="zeile" data-hilfe="Lautstärke der Seite. Die Box und das iPhone haben ihre eigene.">
        <label for="laut">Lautstärke <b id="lautW"></b></label>
        <input type="range" id="laut" min="0" max="100" step="1">
    </div>
    <div class="zeile" id="midiZeile" hidden data-hilfe="Schickt die Töne zusätzlich als MIDI an ein Gerät oder Programm. Am iPhone gibt es das nicht.">
        <label for="midi">MIDI-Ausgang</label>
        <select id="midi"><option value="">aus</option></select>
    </div>
    <div class="zeile wahl knoepfe">
        <button id="neuStart" data-hilfe="Baut den Klang komplett neu auf. Für den Fall, dass trotz Antippen nichts mehr zu hören ist. Meist passiert das von selbst beim nächsten Ton.">Klang neu starten</button>
        <button id="zurueck"data-hilfe="Setzt die Einstellungen dieser Lage (quer oder hochkant) zurück.">Zurücksetzen</button>
    </div>
</div>
<div id="blase" role="status"></div>

<script>
'use strict';
// Stand der Seite, setzt hochladen.sh beim Hochladen auf Datum_Uhrzeit
const VERSION = '20261106_1606';
const NAMEN = ['c', 'cis', 'd', 'dis', 'e', 'f', 'fis', 'g', 'gis', 'a', 'b', 'h'];
const SCHWARZ = new Set([1, 3, 6, 8, 10]);
const SPEICHER = 'klavier.einst';
const STANDARD = {
    quer: { breite: 56, sBreite: 60, sLaenge: 62, reihen: 'auto', abstand: 'anschluss', buendig: false, start: 36 },
    hoch: { breite: 48, sBreite: 60, sLaenge: 62, reihen: 'auto', abstand: 12, buendig: false, start: 36 },
    klang: 'klavier', laut: 80, midi: '', stand: 2, ausrichtung: 'auto', stimmen: 8, verdichten: true,
    schaerfe: { klavier: 30, weich: 20 }
};
const $ = id => document.getElementById(id);
const tasten = $('tasten');
$('version').textContent = VERSION;

let s = JSON.parse(JSON.stringify(STANDARD));
try {
    const g = JSON.parse(localStorage.getItem(SPEICHER) || 'null');
    if (g) s = { ...s, ...g, quer: { ...s.quer, ...g.quer }, hoch: { ...s.hoch, ...g.hoch },
                 schaerfe: { ...s.schaerfe, ...g.schaerfe } };
    // Stand 2 (3.11.): Reihen automatisch statt fester Zahl
    if (g && !(g.stand >= 2)) { s.quer.reihen = s.hoch.reihen = 'auto'; s.stand = 2; }
} catch (e) {}

// Tonumfang: unten bis etwa 10 Hz (E-1 = 10,3 Hz). Oben nur so hoch, dass der Grundton unter einem
// Viertel der Abtastrate bleibt: mit 4-fach überabgetasteter Sättigung landen dann auch deren
// Obertöne nicht als Spiegelfrequenzen im Hörbereich (48 kHz: bis fis'''''' 11,8 kHz)
const TIEFST = 4;
const hoechsterTon = () => Math.floor(69 + 12 * Math.log2((ctx ? ctx.sampleRate : 48000) / 4 / 440));
function sichern() { try { localStorage.setItem(SPEICHER, JSON.stringify(s)); } catch (e) {} }

// Gerätelage über die Media-Query: innerWidth/innerHeight sind auf dem iPhone beim Drehen
// kurz veraltet. Maße vom (nie gedrehten) html-Element.
const querMQ = matchMedia('(orientation: landscape)');
const geraetLage = () => querMQ.matches ? 'quer' : 'hoch';
const sichtB = () => document.documentElement.clientWidth, sichtH = () => document.documentElement.clientHeight;
const lageName = () => s.ausrichtung === 'auto' ? geraetLage() : s.ausrichtung;
// Gewählte Ausrichtung umsetzen: weicht sie vom Gerät ab, wird die Seite gedreht
function ausrichten() {
    const html = document.documentElement, ziel = lageName(), dreh = ziel !== geraetLage();
    html.classList.toggle('gedreht', dreh);
    // Quer gehalten: window.orientation 90 = Oberkante links, dort sitzt die Kamera-Aussparung
    const o = window.orientation;
    html.classList.toggle('kerbe-links', !dreh && o === 90);
    html.classList.toggle('kerbe-rechts', !dreh && o === -90);
    html.classList.toggle('lage-quer', ziel === 'quer');
    html.classList.toggle('lage-hoch', ziel === 'hoch');
    document.body.style.width = dreh ? sichtH() + 'px' : '';
    document.body.style.height = dreh ? sichtB() + 'px' : '';
}
const prof = () => s[lageName()];

// Tonname nach Helmholtz: c' = mittleres C (MIDI 60), c = 48, C = 36, C, = 24
function tonName(n) {
    const o = Math.floor(n / 12) - 4, b = NAMEN[n % 12];
    if (o >= 0) return b + "'".repeat(o);
    return b[0].toUpperCase() + b.slice(1) + ','.repeat(-o - 1);
}
// Tonklasse 0-11, auch für die ausgegrauten Tasten unter MIDI 0
const pc = n => ((n % 12) + 12) % 12;
const weissAb = n => { while (SCHWARZ.has(pc(n))) n--; return n; };
const weissAuf = n => { while (SCHWARZ.has(pc(n))) n++; return n; };

/* ---------- Tastatur aufbauen ---------- */
let reihenMax = 1;
function bauen() {
    const p = prof();
    tasten.innerHTML = '';
    const ABSTAND = 6, PLATZ = tasten.clientHeight - 6, W = tasten.clientWidth - 6;
    const anzahl = Math.max(3, Math.round(W / p.breite)), wwStandard = W / anzahl;
    // Höchstens so viele Reihen, dass die weißen Tasten mindestens quadratisch bleiben.
    // Auto: so viele, dass sie noch etwas länger als breit sind
    reihenMax = Math.max(1, Math.min(40, Math.floor((PLATZ + ABSTAND) / (wwStandard + ABSTAND))));
    const reihenAuto = Math.max(1, Math.min(reihenMax, Math.floor((PLATZ + ABSTAND) / (wwStandard * 1.25 + ABSTAND))));
    const anzahlReihen = p.reihen === 'auto' ? reihenAuto : Math.min(reihenMax, p.reihen);
    $('reihen').max = reihenMax; $('reihen').value = anzahlReihen;
    $('reihenW').textContent = anzahlReihen;
    $('reihenAuto').setAttribute('aria-pressed', String(p.reihen === 'auto'));

    const oben = hoechsterTon(), wu = weissAuf(TIEFST), wo = weissAb(oben);
    // Weiße Tasten aller Reihen, unterste Reihe ab dem Ton anfang. Beginnt eine Reihe mit einer
    // schwarzen Taste (‹ › gehen in Halbtönen), steht sie in weisse.anfang. Oktavreihen bleiben auf
    // demselben Ton (Fis bleibt Fis), Quinte und Quarte beginnen auf der weißen Taste darunter
    const intervall = m => p.abstand === 12 ? m : weissAb(m);
    function plan(anfang) {
        const rs = [];
        let a = anfang;
        for (let r = 0; r < anzahlReihen; r++) {
            if (r > 0) {
                const ende = rs[r - 1][anzahl - 1];
                if (p.abstand === 'anschluss') a = weissAuf(ende + 1);
                else {
                    // Anschließen: so viele Schritte hinauf, dass die Reihe kurz vor dem Ende der Reihe darunter beginnt
                    let k = 1;
                    if (p.buendig) while (intervall(a + (k + 1) * p.abstand) <= weissAuf(ende + 1)) k++;
                    a = intervall(a + k * p.abstand);
                }
            }
            const weisse = [];
            for (let n = a; weisse.length < anzahl; n++) if (!SCHWARZ.has(pc(n))) weisse.push(n);
            weisse.anfang = a;
            rs.push(weisse);
        }
        return rs;
    }
    const letzte = rs => rs[rs.length - 1][anzahl - 1];
    const grau = rs => { let u = 0, o = 0; rs.flat().forEach(n => { if (n < wu) u++; else if (n > wo) o++; }); return [u, o]; };
    let reihenPlan = plan(p.start);
    // Passt der ganze Tonumfang auf den Schirm (große Webseite), steht er in der Mitte:
    // ausgegraute Tasten unten wie oben, statt alles Graue oben
    // Bei Oktave, Quinte, Quarte in ganzen Schritten schieben, damit die Reihen auf ihren Tönen bleiben (z.B. C)
    const runter = n => weissAb(n - (p.abstand === 'anschluss' ? 1 : p.abstand));
    let a = p.start;
    while (a > wu) a = runter(a);
    let probe = plan(a);
    if (letzte(probe) >= wo) {
        let [u, o] = grau(probe);
        for (let schritt = 0; o - u > 1 && schritt < 500; schritt++) {
            const b = runter(a), pb = plan(b), [u2, o2] = grau(pb);
            if (letzte(pb) < wo || u2 - o2 > o - u) break;
            a = b; probe = pb; u = u2; o = o2;
        }
        reihenPlan = probe;
    }

    let tiefst = Infinity, hoechst = -Infinity;
    // Außerhalb des Tonumfangs: ausgegraut und stumm (ohne data-note)

let ctx = null, master = null, lautstaerke = null, kaputt = false, wegKomp = null, wegDirekt = null;
function verdichterSetzen() {
    if (!wegKomp) return;
    wegKomp.gain.value = s.verdichten ? 1 : 0;
    wegDirekt.gain.value = s.verdichten ? 0 : 1;

    // und kommt oft nicht von selbst zurück -> beim nächsten Antippen neu aufbauen
    const meins = ctx;
    ctx.onstatechange = () => { if (ctx === meins && (meins.state === 'interrupted' || meins.state === 'closed')) kaputt = true; };
    // Kette: Stimmen -> master (Sammelschiene) -> Verdichter oder direkt -> weiche Begrenzung -> Lautstärke.
    // Die Lautstärke sitzt am Ende, damit Verdichter und Begrenzung immer gleich arbeiten
    master = ctx.createGain();

    // die Schwelle liegt genau dort. Er greift also erst, wenn mehrere Töne zusammen lauter werden,

// Sättigung für die Schärfe: tanh-Kurve, je schärfer desto stärker angetrieben
const kurven = {};

    if (kurven[k]) return kurven[k];
    const antrieb = 1 + 9 * (k / 20) ** 2, c = new Float32Array(1025);
    for (let i = 0; i < c.length; i++) c[i] = Math.tanh(antrieb * (i / 512 - 1)) / Math.tanh(antrieb);

// Klavierton: Teiltöne mit leichter Spreizung, hohe klingen schneller aus, Klang wird dabei dunkler.
// Schärfe: mehr und lautere Obertöne, Filter offener, insgesamt lauter. Hängt alles an g
function klavierTeiltoene(c, g, f, x, t) {
    const T = klavierDauer(f), oscs = [];
    // Kleine Boxen geben unter etwa 200 Hz kaum etwas her: Grundton leiser, 2.-4. Teilton lauter
    const tief = Math.max(0, Math.min(1, (200 - f) / 130));
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(Math.min(16000, Math.max(f * (4 + 26 * x), 800 + 3000 * x)), t);
    lp.frequency.setTargetAtTime(Math.min(16000, Math.max(f * (2 + 10 * x), 500 + 1500 * x)), t, T / 3);
    lp.connect(g);
    const abfall = 2.2 - 1.9 * x, teile = 4 + Math.round(10 * x);
    const amp = Array.from({ length: teile }, (_, i) => i + 1)
        .filter(k => f * k <= 15000)
        .map(k => (1 / Math.pow(k, abfall)) * (k === 1 ? 1 - 0.6 * tief : k <= 4 ? 1 + 0.8 * tief : 1));
    // Gleich laut über alle Lagen: auf die Summe der Teiltöne normieren
    const norm = 1 / Math.sqrt(amp.reduce((a, b) => a + b * b, 0));
    amp.forEach((a, i) => {
        const k = i + 1;
        const o = c.createOscillator(), og = c.createGain();
        o.frequency.value = f * k * Math.sqrt(1 + 0.0004 * k * k);
        og.gain.setValueAtTime(0, t);
        og.gain.linearRampToValueAtTime(a, t + 0.005);
        og.gain.setTargetAtTime(0, t + 0.005, T / (1 + 0.6 * i) / 3);
        o.connect(og).connect(lp);

/* Vorab gerechnete Klaviertöne: jeder Ton wird einmal in einen Puffer gerechnet und dann von einem

// Stimmenklau: höchstens so viele Stimmen wie eingestellt. Zuerst verstummt der älteste schon

    wahl('ausrichtungWahl', [['auto', 'Auto'], ['hoch', 'Hoch'], ['quer', 'Breit']], s.ausrichtung, v => { s.ausrichtung = v; ausrichten(); });
    $('breite').value = p.breite; $('breiteW').textContent = p.breite + ' px';
    $('sBreite').value = p.sBreite; $('sBreiteW').textContent = p.sBreite + ' %';
    $('sLaenge').value = p.sLaenge; $('sLaengeW').textContent = p.sLaenge + ' %';
    $('laut').value = s.laut; $('lautW').textContent = s.laut + ' %';
    $('schaerfe').value = s.schaerfe[s.klang]; $('schaerfeW').textContent = s.schaerfe[s.klang] + ' %';
    wahl('abstandWahl', [['anschluss', 'Anschließend'], [12, 'Oktave'], [7, 'Quinte'], [5, 'Quarte']], p.abstand, v => { p.abstand = v; });
    $('buendigZeile').hidden = p.abstand === 'anschluss';
    wahl('buendigWahl', [[false, 'Aus'], [true, 'An']], !!p.buendig, v => { p.buendig = v; });
    wahl('klangWahl', [['klavier', 'Klavier'], ['weich', 'Weich (hält)']], s.klang, v => { s.klang = v; });
    wahl('verdichterWahl', [[false, 'Aus'], [true, 'An']], s.verdichten, v => { s.verdichten = v; verdichterSetzen(); });
    wahl('stimmenWahl', [4, 6, 8, 12, 16].map(z => [z, String(z)]), s.stimmen, v => { s.stimmen = v; stimmenKappen(v); });
}
[['breite', ' px'], ['sBreite', ' %'], ['sLaenge', ' %']].forEach(([id, einheit]) => {
    $(id).addEventListener('input', e => {
        prof()[id] = +e.target.value;
        $(id + 'W').textContent = e.target.value + einheit;
        sichern(); neuBauen();
    });
});
// Regler über die ganze Zeile ziehen: erst wenn der Finger klar waagrecht läuft, verstellt er den Wert
// (relativ, wie ein langer Ziehweg). Senkrecht gibt der Browser den Finger ans Scrollen ab (pointercancel)
// Bei gedrehter Seite (fest Hoch/Breit, Gerät anders gehalten) läuft die Seiten-Waagrechte senkrecht über den Schirm
const istGedreht = () => document.documentElement.classList.contains('gedreht');
const seitenPunkt = e => istGedreht() ? { x: e.clientY, y: -e.clientX } : { x: e.clientX, y: e.clientY };
// Gedrehte Seite: Einstellungen selbst scrollen, Finger folgt 1:1, beim Loslassen mit Nachlauf
const einstFeld = $('einst');
let roll = null, nachlauf = 0;
einstFeld.addEventListener('pointerdown', e => {
    cancelAnimationFrame(nachlauf);
    if (!istGedreht() || document.body.classList.contains('hilfemodus')) return;
    const p = seitenPunkt(e);
    roll = { id: e.pointerId, x: p.x, y: p.y, top: einstFeld.scrollTop, an: false, v: 0, t: e.timeStamp, ly: p.y };
});
einstFeld.addEventListener('pointermove', e => {
    if (!roll || e.pointerId !== roll.id) return;
    const p = seitenPunkt(e), dx = p.x - roll.x, dy = p.y - roll.y;
    if (!roll.an) {
        // klar waagrecht: das ist ein Regler, kein Scrollen
        if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { roll = null; return; }
        if (Math.abs(dy) < 8) return;
        roll.an = true; roll.y = p.y; roll.ly = p.y; roll.t = e.timeStamp;
        try { einstFeld.setPointerCapture(e.pointerId); } catch (err) {}
        return;
    }
    einstFeld.scrollTop = roll.top - (p.y - roll.y);
    const dt = e.timeStamp - roll.t;
    if (dt > 0) roll.v = 0.7 * (roll.ly - p.y) / dt + 0.3 * roll.v;   // Bildpunkte je Millisekunde
    roll.t = e.timeStamp; roll.ly = p.y;
});
['pointerup', 'pointercancel'].forEach(typ => einstFeld.addEventListener(typ, e => {
    if (!roll || e.pointerId !== roll.id) return;
    let v = roll.an && e.timeStamp - roll.t < 80 ? roll.v : 0;
    roll = null;
    let zuletzt = performance.now();
    const schritt = jetzt => {
        const dt = Math.min(40, jetzt - zuletzt); zuletzt = jetzt;
        einstFeld.scrollTop += v * dt;
        v *= Math.pow(0.996, dt);
        if (Math.abs(v) > 0.02) nachlauf = requestAnimationFrame(schritt);
    };
    if (Math.abs(v) > 0.05) nachlauf = requestAnimationFrame(schritt);
}));
const einstRollt = () => !!(roll && roll.an);
document.querySelectorAll('.zeile input[type=range]').forEach(inp => {
    const zeile = inp.closest('.zeile');
    zeile.classList.add('regel');
    zeile.dataset.hilfe += ' Zum Einstellen irgendwo in der Zeile waagrecht ziehen, senkrecht wischen scrollt.';
    let z = null;
    zeile.addEventListener('pointerdown', e => {
        if (document.body.classList.contains('hilfemodus')) return;
        const p = seitenPunkt(e);
        z = { id: e.pointerId, x: p.x, y: p.y, wert: +inp.value, an: false };
    });
    zeile.addEventListener('pointermove', e => {
        if (!z || e.pointerId !== z.id) return;
        const p = seitenPunkt(e), dx = p.x - z.x, dy = p.y - z.y;
        if (!z.an) {
            if (einstRollt() || (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx))) { z = null; return; }
            if (Math.abs(dx) < 8) return;
            z.an = true; z.x = p.x;
            zeile.classList.add('zieht');
            try { zeile.setPointerCapture(e.pointerId); } catch (err) {}
            return;
        }
        // Länge des Reglers ohne Drehung (getBoundingClientRect wäre gedreht nur seine Dicke): Regler folgt dem Finger
        const min = +inp.min, max = +inp.max, w = inp.offsetWidth || 200;
        const neu = Math.round(Math.min(max, Math.max(min, z.wert + (p.x - z.x) / w * (max - min))));
        if (neu !== +inp.value) { inp.value = neu; inp.dispatchEvent(new Event('input')); }
    });
    const ende = () => { z = null; zeile.classList.remove('zieht'); };
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => zeile.addEventListener(t, ende));
});
// Reihen: Regler endet dort, wo die Tasten quadratisch werden (setzt bauen); Auto-Knopf daneben
$('reihen').addEventListener('input', e => { prof().reihen = +e.target.value; sichern(); neuBauen(); });
$('reihenAuto').onclick = () => { prof().reihen = 'auto'; sichern(); bauen(); };

$('schaerfe').addEventListener('input', e => {

};
function einstAuf() { einstZeigen(); $('einst').classList.add('offen'); $('fertig').focus(); midiLaden(); }
function einstZu() { $('einst').classList.remove('offen'); $('einstKnopf').focus(); }
leistenKnopf('einstKnopf', () => $('einst').classList.contains('offen') ? einstZu() : einstAuf());
$('fertig').onclick = einstZu;
$('zurueck').onclick = () => {
    s[lageName()] = { ...STANDARD[lageName()] };

};

/* ---------- Hilfemodus ---------- */
const blase = $('blase');
function hilfeAus() { document.body.classList.remove('hilfemodus'); blase.classList.remove('offen'); }
leistenKnopf('hilfeKnopf', () => {
    if (document.body.classList.toggle('hilfemodus')) {
        blase.textContent = 'Hilfe: Tippe auf ein umrandetes Feld. Esc oder ? beendet.';
        blase.classList.add('offen');
    } else hilfeAus();
});
['pointerdown', 'click'].forEach(typ => document.addEventListener(typ, e => {
    if (!document.body.classList.contains('hilfemodus')) return;
    if (e.target.closest('#hilfeKnopf')) return;
    const el = e.target.closest('[data-hilfe]');
    e.preventDefault(); e.stopPropagation();
    if (el && typ === 'click') { blase.textContent = el.dataset.hilfe; blase.classList.add('offen'); }
}, true));

document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (document.body.classList.contains('hilfemodus')) hilfeAus();
    else if ($('einst').classList.contains('offen')) einstZu();
});

ausrichten();
bauen();
